<main class="pb-12">
  <div class="mt-10">
    <section
      class="rounded-4xl border border-white/10 bg-black/30 backdrop-blur-xl shadow-2xl overflow-hidden"
      aria-labelledby="venue-distribution-title"
    >
      <header
        class="flex flex-col md:flex-row items-start md:items-center justify-between p-8 border-b border-white/5 bg-white/1 gap-4"
      >
        <div class="flex items-center gap-4">
          <span class="material-symbols-outlined text-3xl text-slate-200" aria-hidden="true"
            >map</span
          >
          <h2 id="venue-distribution-title" class="text-2xl font-bold text-white tracking-tight">
            Venue Distribution
          </h2>
        </div>

        <div
          class="flex gap-1 p-1 bg-black/40 rounded-xl border border-white/5"
          role="group"
          aria-label="Venue type filters"
        >
          <button
            (click)="toggleFilter('show')"
            [class]="
              locationService.activeFilters().includes('show')
                ? 'bg-white/10 text-white shadow-lg'
                : 'text-slate-500 hover:text-slate-200'
            "
            class="px-5 py-1.5 text-xs font-bold rounded-lg transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-primary"
            aria-pressed="{{ locationService.activeFilters().includes('show') }}"
          >
            Shows
          </button>
          <button
            (click)="toggleFilter('rehearsalspace')"
            [class]="
              locationService.activeFilters().includes('rehearsalspace')
                ? 'bg-white/10 text-white shadow-lg'
                : 'text-slate-500 hover:text-slate-200'
            "
            class="px-5 py-1.5 text-xs font-bold rounded-lg transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-primary"
            aria-pressed="{{ locationService.activeFilters().includes('rehearsalspace') }}"
          >
            Rehearsal
          </button>
        </div>
      </header>

      <div class="p-8">
        <div
          id="map"
          class="w-full aspect-4/5 sm:aspect-video md:aspect-3/2 lg:aspect-21/9 rounded-3xl border border-white/5 bg-slate-900/50 overflow-hidden transition-opacity duration-500"
          role="application"
          aria-label="Venue map"
          tabindex="0"
        ></div>

        <div class="mt-4 flex flex-col md:flex-row justify-between items-center px-2 gap-2">
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse" aria-hidden="true"></div>
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">
              {{ filteredPointsCount }} Points Active
            </span>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>
