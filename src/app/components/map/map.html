<main class="pb-12">
  <div class="mt-10">
    <div
      class="rounded-4xl border border-white/10 bg-black/30 backdrop-blur-xl shadow-2xl overflow-hidden"
    >
      <div class="flex items-center justify-between p-8 border-b border-white/5 bg-white/1">
        <div class="flex items-center gap-4">
          <span class="material-symbols-outlined text-3xl text-slate-200">map</span>
          <h2 class="text-2xl font-bold text-white tracking-tight">Venue Distribution</h2>
        </div>

        <div class="flex gap-1 p-1 bg-black/40 rounded-xl border border-white/5">
          <button
            (click)="toggleFilter('show')"
            [class]="
              locationService.activeFilters().includes('show')
                ? 'bg-white/10 text-white shadow-lg'
                : 'text-slate-500 hover:text-slate-200'
            "
            class="px-5 py-1.5 text-xs font-bold rounded-lg transition-all"
          >
            Shows
          </button>
          <button
            (click)="toggleFilter('rehearsalspace')"
            [class]="
              locationService.activeFilters().includes('rehearsalspace')
                ? 'bg-white/10 text-white shadow-lg'
                : 'text-slate-500 hover:text-slate-200'
            "
            class="px-5 py-1.5 text-xs font-bold rounded-lg transition-all"
          >
            Rehearsal spaces
          </button>
        </div>
      </div>

      <div class="p-8">
        <div
          id="map"
          class="w-full aspect-21/9 rounded-3xl border border-white/5 bg-slate-900/50 overflow-hidden transition-opacity duration-500"
          role="application"
        ></div>

        <div class="mt-4 flex justify-between items-center px-2">
          <div class="flex items-center gap-2">
            <div class="size-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest"
              >{{ locationService.locationsSignal().length }} Points Active</span
            >
          </div>
        </div>
      </div>
    </div>
  </div>

  @if (locationService.locationModalActive()) {
    <div
      class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-in fade-in duration-300"
    >
      <div
        class="w-full max-w-sm rounded-3xl border border-white/10 bg-slate-900/90 p-1 shadow-2xl backdrop-blur-2xl"
      >
        <div
          class="flex items-center justify-between px-6 py-5 border-b border-white/5 bg-white/2 rounded-t-3xl text-white"
        >
          <h2 class="font-bold text-lg">Add New Point</h2>
          <button (click)="closeModals()" class="text-slate-500 hover:text-white transition-colors">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <form class="flex flex-col gap-6 p-6">
          <div class="space-y-2">
            <label class="text-[10px] font-black uppercase tracking-widest text-slate-500 ml-1"
              >Location Name</label
            >
            <input
              type="text"
              [value]="locationService.nameInput()"
              (input)="onNameInput($event)"
              placeholder="Venue name..."
              class="w-full px-4 py-3 bg-black/40 border border-white/10 rounded-2xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-primary/40 transition-all"
            />
          </div>
          <div class="flex justify-end gap-3 pt-2">
            <button
              (click)="closeModals()"
              type="button"
              class="px-5 py-2.5 text-xs font-bold rounded-xl border border-white/5 text-slate-400"
            >
              Cancel
            </button>
            <button
              (click)="saveLocation()"
              type="button"
              class="px-8 py-2.5 text-xs rounded-xl bg-primary text-white font-black shadow-lg shadow-primary/20 active:scale-95 transition-all"
            >
              Save Point
            </button>
          </div>
        </form>
      </div>
    </div>
  }
</main>
