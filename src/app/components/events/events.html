<div
  class="relative min-h-screen overflow-hidden bg-black font-display text-slate-100 selection:bg-primary/30"
>
  <section
    class="relative h-[40vh] min-h-75 w-full overflow-hidden bg-black flex items-center justify-center"
    aria-label="Events header"
  >
    <div class="absolute inset-0 z-0">
      <img src="assets/img/events.jpg" class="h-full w-full object-cover opacity-60" alt="" />
      <div class="absolute inset-0 bg-linear-to-b from-black via-transparent to-black"></div>
    </div>

    <header class="relative z-10 text-center px-4">
      <h1
        class="text-white text-3xl md:text-5xl font-bold uppercase tracking-widest drop-shadow-lg"
      >
        Plan your shows
      </h1>
      <div class="mt-2 w-16 h-1 bg-primary mx-auto rounded-full"></div>
    </header>
  </section>

  <div
    class="absolute -top-32 -left-32 h-96 w-96 rounded-full bg-primary/10 blur-[140px] pointer-events-none"
    aria-hidden="true"
  ></div>
  <div
    class="absolute -bottom-32 -right-32 h-96 w-96 rounded-full bg-cyan-500/10 blur-[140px] pointer-events-none"
    aria-hidden="true"
  ></div>

  <main class="relative z-10 p-4 sm:p-6 lg:p-10" role="main">
    <div class="max-w-350 mx-auto space-y-8">
      <section aria-label="Charts">
        <app-charts></app-charts>
      </section>

      <section class="grid grid-cols-1 xl:grid-cols-12 gap-6 lg:gap-8">
        <div class="xl:col-span-8 space-y-6 lg:space-y-8">
          <section aria-label="Calendar">
            <app-calendar></app-calendar>
          </section>

          <section aria-label="Map">
            <app-map></app-map>
          </section>
        </div>

        <aside class="xl:col-span-4 space-y-6 lg:space-y-8" aria-label="Upcoming events">
          <section
            class="rounded-2xl border border-white/10 bg-black/30 backdrop-blur-md overflow-hidden shadow-xl transition-all"
          >
            <header class="p-5 sm:p-6 border-b border-white/5 bg-white/2">
              <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <span class="material-symbols-outlined text-primary" aria-hidden="true">
                  local_activity
                </span>
                Upcoming events
              </h2>
            </header>

            <ul class="divide-y divide-white/5">
              @for (event of calendarService.upcomingEvents(); track event.id) {
                <li>
                  <button
                    type="button"
                    class="w-full flex items-center gap-4 p-4 sm:p-5 hover:bg-white/5 transition-all group text-left focus:outline-none focus:ring-2 focus:ring-primary/40"
                    tabindex="0"
                  >
                    <div
                      class="flex flex-col items-center justify-center h-14 w-14 rounded-2xl bg-primary/10 text-primary border border-primary/20 group-hover:bg-primary group-hover:text-white transition-all shadow-inner"
                    >
                      <span class="text-base font-black">
                        {{ event.event_date.slice(8, 10) }}
                      </span>
                      <span class="text-[9px] font-black uppercase tracking-tighter">
                        {{ monthToString(event.event_date.slice(5, 7)) }}
                      </span>
                    </div>

                    <div class="flex-1 min-w-0">
                      <h3
                        class="text-sm font-bold text-white truncate group-hover:text-primary transition-colors"
                      >
                        {{ event.title }}
                      </h3>
                      <p class="text-xs text-slate-500 flex items-center gap-1">
                        <span class="material-symbols-outlined text-xs" aria-hidden="true">
                          location_on
                        </span>
                        {{ event.street }}
                      </p>
                    </div>

                    <span
                      class="material-symbols-outlined text-slate-600 group-hover:text-white transition-colors"
                      aria-hidden="true"
                    >
                      chevron_right
                    </span>
                  </button>
                </li>
              }
            </ul>
          </section>
        </aside>
      </section>
    </div>
  </main>
</div>
