<main
  class="relative min-h-screen overflow-hidden bg-slate-950 font-display text-slate-100 selection:bg-primary/30"
>
  <div
    class="absolute -top-32 -left-32 h-96 w-96 rounded-full bg-primary/10 blur-[140px] pointer-events-none"
    aria-hidden="true"
  ></div>
  <div
    class="absolute -bottom-32 -right-32 h-96 w-96 rounded-full bg-cyan-500/10 blur-[140px] pointer-events-none"
    aria-hidden="true"
  ></div>

  <section class="relative z-10 px-6 pt-28 pb-32">
    <div class="mx-auto max-w-4xl space-y-8 text-center">
      <div class="space-y-4">
        <h1 class="text-5xl font-extrabold tracking-tight md:text-7xl">
          <span
            class="bg-linear-to-r from-primary via-purple-400 to-cyan-400 bg-clip-text text-transparent"
          >
            Waiting Room
          </span>
        </h1>
        <p class="mx-auto max-w-2xl text-lg font-light text-slate-400 md:text-xl">
          Marketplace for musicians and session artists.
        </p>
      </div>

      <div class="group relative mx-auto max-w-2xl">
        <div
          class="absolute -inset-1 rounded-xl bg-linear-to-r from-primary to-purple-400 opacity-20 blur-sm transition duration-700 group-hover:opacity-40"
          aria-hidden="true"
        ></div>

        <form
          (submit)="$event.preventDefault()"
          class="relative flex items-center overflow-hidden rounded-xl border border-white/10 bg-black/30 p-2 backdrop-blur-md"
        >
          <label for="main-search" class="sr-only">Search musicians or instruments</label>
          <div class="pl-4 text-slate-500">
            <span class="material-symbols-outlined" aria-hidden="true">search</span>
          </div>

          <input
            id="main-search"
            type="text"
            placeholder="Search musicians, instruments..."
            class="w-full border-none bg-transparent px-4 py-3 text-lg text-slate-200 outline-hidden placeholder:text-slate-600 focus:ring-0"
          />

          <button
            type="submit"
            class="rounded-lg bg-primary px-8 py-3 font-bold text-white shadow-lg shadow-primary/20 transition-all hover:brightness-110 active:scale-95 whitespace-nowrap"
          >
            Search
          </button>
        </form>
      </div>

      <nav
        class="flex flex-wrap justify-center gap-3 text-xs font-medium uppercase tracking-widest text-slate-500"
        aria-label="Popular searches"
      >
        <span aria-hidden="true">Popular:</span>
        <a class="transition-colors hover:text-primary focus:text-primary outline-hidden" href="#"
          >Synthwave</a
        >
        <span aria-hidden="true">•</span>
        <a class="transition-colors hover:text-primary focus:text-primary outline-hidden" href="#"
          >Lo-fi Beats</a
        >
        <span aria-hidden="true">•</span>
        <a class="transition-colors hover:text-primary focus:text-primary outline-hidden" href="#"
          >Session Bass</a
        >
      </nav>
    </div>
  </section>

  <section class="relative z-10 mx-auto max-w-7xl px-6 pb-24">
    <div class="mb-12 flex flex-col justify-between gap-4 md:flex-row md:items-end">
      <div class="space-y-2">
        <h2
          class="bg-linear-to-r from-primary via-purple-400 to-cyan-400 bg-clip-text text-3xl font-bold tracking-tight text-transparent"
        >
          Browse by Category
        </h2>
        <p class="text-slate-500">Explore talent across every sonic spectrum.</p>
      </div>

      <a
        class="flex items-center gap-1 font-medium text-primary transition-all hover:opacity-80 focus:ring-2 focus:ring-primary focus:outline-hidden"
        href="#"
      >
        View all categories
        <span class="material-symbols-outlined text-sm" aria-hidden="true">arrow_forward</span>
      </a>
    </div>

    <div class="grid grid-cols-2 gap-5 md:grid-cols-3 lg:grid-cols-6" role="list">
      <button
        type="button"
        role="listitem"
        class="group flex flex-col items-center gap-4 rounded-2xl border border-white/10 bg-black/30 p-8 backdrop-blur-md transition-all hover:-translate-y-1 hover:border-primary/40 hover:shadow-xl hover:shadow-primary/10 focus:ring-2 focus:ring-primary focus:outline-hidden"
      >
        <div
          class="flex size-14 items-center justify-center rounded-full bg-primary/10 text-primary transition-all group-hover:bg-primary group-hover:text-white shadow-inner"
        >
          <span class="material-symbols-outlined text-3xl" aria-hidden="true">piano</span>
        </div>
        <h3 class="font-semibold text-slate-300 group-hover:text-white">Keys</h3>
      </button>

      <button
        type="button"
        role="listitem"
        class="group flex flex-col items-center gap-4 rounded-2xl border border-white/10 bg-black/30 p-8 backdrop-blur-md transition-all hover:-translate-y-1 hover:border-primary/40 hover:shadow-xl hover:shadow-primary/10 focus:ring-2 focus:ring-primary focus:outline-hidden"
      >
        <div
          class="flex size-14 items-center justify-center rounded-full bg-primary/10 text-primary transition-all group-hover:bg-primary group-hover:text-white shadow-inner"
        >
          <span class="material-symbols-outlined text-3xl" aria-hidden="true">mic</span>
        </div>
        <h3 class="font-semibold text-slate-300 group-hover:text-white">Vocals</h3>
      </button>

      <button
        type="button"
        role="listitem"
        class="group flex flex-col items-center gap-4 rounded-2xl border border-white/10 bg-black/30 p-8 backdrop-blur-md transition-all hover:-translate-y-1 hover:border-primary/40 hover:shadow-xl hover:shadow-primary/10 focus:ring-2 focus:ring-primary focus:outline-hidden"
      >
        <div
          class="flex size-14 items-center justify-center rounded-full bg-primary/10 text-primary transition-all group-hover:bg-primary group-hover:text-white shadow-inner"
        >
          <span class="material-symbols-outlined text-3xl" aria-hidden="true">potted_plant</span>
        </div>
        <h3 class="font-semibold text-slate-300 group-hover:text-white">Drums</h3>
      </button>

      <button
        type="button"
        role="listitem"
        class="group flex flex-col items-center gap-4 rounded-2xl border border-white/10 bg-black/30 p-8 backdrop-blur-md transition-all hover:-translate-y-1 hover:border-primary/40 hover:shadow-xl hover:shadow-primary/10 focus:ring-2 focus:ring-primary focus:outline-hidden"
      >
        <div
          class="flex size-14 items-center justify-center rounded-full bg-primary/10 text-primary transition-all group-hover:bg-primary group-hover:text-white shadow-inner"
        >
          <span class="material-symbols-outlined text-3xl" aria-hidden="true">music_note</span>
        </div>
        <h3 class="font-semibold text-slate-300 group-hover:text-white">Guitars</h3>
      </button>

      <button
        type="button"
        role="listitem"
        class="group flex flex-col items-center gap-4 rounded-2xl border border-white/10 bg-black/30 p-8 backdrop-blur-md transition-all hover:-translate-y-1 hover:border-primary/40 hover:shadow-xl hover:shadow-primary/10 focus:ring-2 focus:ring-primary focus:outline-hidden"
      >
        <div
          class="flex size-14 items-center justify-center rounded-full bg-primary/10 text-primary transition-all group-hover:bg-primary group-hover:text-white shadow-inner"
        >
          <span class="material-symbols-outlined text-3xl" aria-hidden="true">album</span>
        </div>
        <h3 class="font-semibold text-slate-300 group-hover:text-white">DJs</h3>
      </button>

      <button
        type="button"
        role="listitem"
        class="group flex flex-col items-center gap-4 rounded-2xl border border-white/10 bg-black/30 p-8 backdrop-blur-md transition-all hover:-translate-y-1 hover:border-primary/40 hover:shadow-xl hover:shadow-primary/10 focus:ring-2 focus:ring-primary focus:outline-hidden"
      >
        <div
          class="flex size-14 items-center justify-center rounded-full bg-primary/10 text-primary transition-all group-hover:bg-primary group-hover:text-white shadow-inner"
        >
          <span class="material-symbols-outlined text-3xl" aria-hidden="true">equalizer</span>
        </div>
        <h3 class="font-semibold text-slate-300 group-hover:text-white">Bass</h3>
      </button>
    </div>
  </section>
</main>
