<div class="w-full">
  <div class="grid grid-cols-4 gap-3">
    @for (photo of uploadService.allPhotos(); track photo.id) {
      <div class="relative group">
        <button
          type="button"
          (click)="openPhoto(photo.url)"
          class="relative aspect-square w-full overflow-hidden rounded-xl border-2 border-dashed border-white/10 transition-colors hover:border-primary focus-visible:ring-2 focus-visible:ring-primary focus-visible:outline-hidden"
          aria-label="View large photo"
        >
          <img [src]="photo.url" class="h-full w-full object-cover" alt="Gallery photo" />
        </button>

        @if (!uploadService.isPhotoTemporary(photo.id)) {
          <button
            type="button"
            (click)="removePhoto(photo)"
            class="absolute cursor-pointer top-1.5 right-1.5 z-10 flex size-7 items-center justify-center rounded-full bg-black/60 text-white transition-colors hover:bg-red-600 focus-visible:ring-2 focus-visible:ring-red-400 focus-visible:outline-hidden"
            aria-label="Delete photo"
          >
            <ng-icon name="heroTrash" size="14" aria-hidden="true" />
          </button>
        }
      </div>
    }

    @if (uploadService.canAddMorePhotos()) {
      <button
        type="button"
        (click)="triggerFileInput()"
        class="flex aspect-square w-full flex-col items-center justify-center rounded-xl border-2 border-dashed border-white/10 text-slate-500 transition-colors hover:border-violet-500 focus-visible:ring-2 focus-visible:ring-violet-500 focus-visible:outline-hidden cursor-pointer"
      >
        <ng-icon name="heroArrowDownTray" size="24" aria-hidden="true" />
        <span class="mt-1 text-xs">Upload</span>
      </button>
    }
  </div>

  @if (uploadService.selectedPhoto()) {
    <div
      role="dialog"
      aria-modal="true"
      (click)="closePhoto()"
      (keydown.escape)="closePhoto()"
      class="flex rounded-xl items-center justify-center bg-blue/90 px-4 py-8 backdrop-blur-sm animate-in fade-in duration-300"
    >
      <section
        tabindex="-1"
        (click)="$event.stopPropagation()"
        (keydown)="$event.stopPropagation()"
        class="relative max-h-[90%] max-w-[90%] focus:outline-hidden"
      >
        <img
          #img
          [src]="uploadService.selectedPhoto() || 'assets/img/Portrait_Placeholder.png'"
          (error)="img.src = 'assets/img/Portrait_Placeholder.png'"
          class="w-full rounded-lg shadow-2xl animate-in zoom-in-95 duration-300"
          alt="Full size view"
        />

        <button
          type="button"
          (click)="closePhoto()"
          class="absolute -top-5 -right-8 text-white hover:text-primary cursor-pointer transition-colors flex items-center gap-2"
        >
          <span class="material-symbols-outlined">close</span>
        </button>
      </section>
    </div>
  }

  <input
    type="file"
    #galleryFileInput
    hidden
    accept="image/*"
    multiple
    (change)="onGallerySelected($event)"
  />
</div>
