<section class="glass-card rounded-3xl p-6" [formGroup]="form">
  <div class="flex justify-between items-center">
    <h2 class="text-xl font-bold text-white mb-6">Digital Presence</h2>
  </div>

  <div class="space-y-4" formArrayName="social_links">
    @for (link of links.controls; track $index) {
      <div
        [formGroupName]="$index"
        class="flex flex-col md:flex-row gap-2 md:gap-4 items-stretch md:items-center p-4 bg-white/5 rounded-2xl border border-white/5"
      >
        <div class="md:w-1/4">
          <select
            formControlName="platform"
            class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-white outline-none focus:border-purple-500 transition-colors appearance-none"
          >
            <option value="instagram">Instagram</option>
            <option value="youtube">YouTube</option>
            <option value="spotify">Spotify</option>
            <option value="soundcloud">SoundCloud</option>
          </select>
        </div>

        <div class="flex-1 relative flex items-center">
          <div
            class="flex items-center w-full bg-black/40 border border-white/10 rounded-xl overflow-hidden focus-within:border-purple-500 transition-colors"
          >
            <span class="pl-3 text-slate-500 text-sm hidden lg:block select-none whitespace-nowrap">
              {{ link.get('platform')?.value || 'link' }}.com/
            </span>
            <input
              formControlName="url"
              placeholder="your_username"
              class="w-full bg-transparent p-3 text-white outline-none"
            />
          </div>
        </div>

        <button
          type="button"
          (click)="removeLink($index)"
          class="text-red-400 p-2 hover:bg-red-400/10 rounded-xl self-end md:self-center transition-colors"
          title="Remove link"
        >
          <span class="material-symbols-outlined text-[20px]">delete</span>
        </button>
      </div>
    }

    @if (presenceService.pendingLinks().length > 0) {
      <span class="text-xs text-slate-600 block mt-2"> Enter your handle/username </span>
    } @else {
      <div
        class="text-center py-4 text-slate-500 text-sm italic border border-dashed border-white/5 rounded-xl"
      >
        No socials yet!
      </div>
    }
  </div>

  <div class="mt-8 flex flex-col md:flex-row gap-4">
    <button
      type="button"
      (click)="addLink()"
      class="flex-1 px-4 py-3 border border-dashed border-white/20 rounded-xl text-slate-400 hover:text-white hover:border-white/40 transition-all"
    >
      + Add social
    </button>
  </div>
</section>
