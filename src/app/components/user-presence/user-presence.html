<section class="glass-card rounded-3xl p-6" [formGroup]="form">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-white">Presencia Digital</h2>
    <span class="text-xs text-slate-500 uppercase tracking-tighter"
      >Solo escribe tu nombre de usuario</span
    >
  </div>

  <div class="space-y-4" formArrayName="social_links">
    @for (link of linksForTemplate(); track $index; let i = $index) {
      <div
        [formGroupName]="i"
        class="flex flex-col md:flex-row gap-2 md:gap-4 items-stretch md:items-center p-4 bg-white/5 rounded-2xl border border-white/5"
      >
        <div class="md:w-1/4">
          <select
            formControlName="platform"
            class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-white outline-none focus:border-purple-500 transition-colors"
          >
            <option value="instagram">Instagram</option>
            <option value="youtube">YouTube</option>
            <option value="spotify">Spotify</option>
            <option value="soundcloud">SoundCloud</option>
          </select>
        </div>

        <div class="flex-1 relative flex items-center">
          <div
            class="flex items-center w-full bg-black/40 border border-white/10 rounded-xl overflow-hidden focus-within:border-purple-500 transition-colors"
          >
            <span
              class="pl-3 text-slate-500 text-sm hidden lg:block select-none truncate max-w-[150px]"
            >
              {{ link.get('platform')?.value }}.com/
            </span>
            <input
              formControlName="handle"
              placeholder="tu_usuario"
              class="w-full bg-transparent p-3 text-white outline-none"
            />
          </div>
        </div>

        <button
          (click)="removeLink(i)"
          class="text-red-400 p-2 hover:bg-red-400/10 rounded-xl self-end md:self-center"
        >
          <span class="material-symbols-outlined">delete</span>
        </button>
      </div>
    }
  </div>

  <div class="mt-8 flex flex-col md:flex-row gap-4">
    <button
      (click)="addLink()"
      class="flex-1 px-4 py-3 border border-dashed border-white/20 rounded-xl text-slate-400 hover:text-white hover:border-white/40 transition-all"
    >
      + Añadir otra red
    </button>

    <button
      (click)="save()"
      [disabled]="form.invalid || form.pristine"
      class="flex-1 md:flex-[0.5] px-6 py-3 bg-purple-600 disabled:opacity-30 disabled:cursor-not-allowed rounded-xl text-white font-bold shadow-lg shadow-purple-600/20"
    >
      Guardar Cambios
    </button>
  </div>
</section>
