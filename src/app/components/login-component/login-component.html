<section>
  <div class="absolute inset-0 z-0">
    <img
      src="assets/img/login.webp"
      class="h-full w-full object-cover opacity-60"
      alt="Sala de ensayo"
    />
    <div class="absolute inset-0 bg-linear-to-t from-black via-transparent to-black/50"></div>
  </div>

  <div class="relative z-10 flex flex-col items-center text-center px-4">
    <div class="mb-6 transform transition-hover hover:scale-105 duration-300">
      <img
        src="assets/img/logo.webp"
        class="mt-10 w-48 md:w-64 object-contain"
        alt="Waiting Room Logo"
      />
    </div>
  </div>
</section>

<main
  class="items-center flex justify-center p-20 pb-20 bg-black font-display text-slate-100 selection:bg-primary/30"
>
  <div class="relative w-full max-w-md z-10">
    <div
      class="absolute -top-20 -left-20 w-64 h-64 bg-primary/10 rounded-full blur-[120px] pointer-events-none"
      aria-hidden="true"
    ></div>
    <div
      class="glass-card rounded-3xl overflow-hidden shadow-2xl animate-in fade-in zoom-in-95 duration-500"
    >
      <div class="h-1 w-full bg-white/5" role="none">
        <div class="h-full bg-linear-to-r from-primary to-purple-400 w-full"></div>
      </div>

      <header class="p-8 text-center">
        <div
          class="inline-flex items-center justify-center size-14 rounded-2xl bg-primary/10 text-primary mb-6 shadow-inner"
        >
          <span class="material-symbols-outlined text-3xl" aria-hidden="true">login</span>
        </div>
        <h1
          class="text-2xl font-black tracking-tight bg-linear-to-r from-primary via-purple-400 to-cyan-400 bg-clip-text text-transparent"
        >
          Login
        </h1>
      </header>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="px-8 pb-8 space-y-5" novalidate>
        <div class="space-y-2">
          <label
            for="login-email"
            class="text-xs font-semibold uppercase tracking-widest text-slate-500 ml-1"
          >
            Email
          </label>
          <div class="relative group">
            <span
              class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-primary transition-colors"
              aria-hidden="true"
            >
              email
            </span>
            <input
              id="login-email"
              type="email"
              formControlName="email"
              placeholder="Enter your email"
              [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched"
              class="w-full pl-12 pr-4 py-3 bg-black/30 border border-white/10 rounded-xl focus:ring-1 focus:ring-primary focus:border-primary/50 outline-hidden transition-all placeholder:text-slate-600 text-slate-200"
            />
          </div>
        </div>

        <div class="space-y-2">
          <label
            for="login-password"
            class="text-xs font-semibold uppercase tracking-widest text-slate-500 ml-1"
          >
            Password
          </label>
          <div class="relative group">
            <span
              class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-primary transition-colors"
              aria-hidden="true"
            >
              lock
            </span>
            <input
              id="login-password"
              type="password"
              formControlName="password"
              placeholder="Enter password"
              [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
              class="w-full pl-12 pr-4 py-3 bg-black/30 border border-white/10 rounded-xl focus:ring-1 focus:ring-primary focus:border-primary/50 outline-hidden transition-all placeholder:text-slate-600 text-slate-200"
            />
          </div>
        </div>

        <div class="space-y-3 pt-2">
          <button
            type="submit"
            [disabled]="isLoading() || form.invalid"
            class="group cursor-pointer w-full py-3 bg-primary hover:bg-primary/90 text-white font-black rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2 disabled:opacity-50 focus-visible:ring-2 focus-visible:ring-primary focus-visible:outline-hidden"
          >
            <span>{{ isLoading() ? 'Logging in...' : 'Login' }}</span>
            <span
              class="material-symbols-outlined transition-transform group-hover:translate-x-1"
              aria-hidden="true"
            >
              arrow_forward
            </span>
          </button>

          <nav
            class="flex flex-col gap-2 text-center text-sm pt-1"
            aria-label="Login secondary actions"
          >
            <button
              type="button"
              [disabled]="isLoading()"
              class="text-primary cursor-pointer hover:text-primary/80 transition-colors font-medium focus-visible:outline-primary disabled:opacity-50"
              (click)="resetPassword()"
            >
              Reset password
            </button>
            <button
              type="button"
              [disabled]="isLoading()"
              routerLink="/register"
              class="text-slate-500 hover:text-primary transition-colors focus-visible:outline-primary disabled:opacity-50"
            >
              Not a user? Click <b class="cursor-pointer">here</b> to register
            </button>
          </nav>
        </div>
      </form>
    </div>
  </div>
</main>
