<main class="mb-10">
  <div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
      <div
        class="bg-slate-900/50 border border-white/5 p-5 rounded-3xl flex flex-col justify-between h-40"
      >
        <div class="flex justify-between items-start">
          <div>
            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest"
              >Total Gigs</span
            >
            <h2 class="text-3xl font-black text-white mt-1">128</h2>
          </div>
          <span
            class="bg-emerald-500/10 text-emerald-400 text-[10px] font-bold px-2 py-1 rounded-lg"
            >+12%</span
          >
        </div>
        <div class="h-12 w-full">
          <canvas #gigsMiniChart></canvas>
        </div>
      </div>

      <div
        class="bg-slate-900/50 border border-white/5 p-5 rounded-3xl flex flex-col justify-between"
      >
        <div class="flex justify-between items-start">
          <div>
            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest"
              >Revenue</span
            >
            <h2 class="text-3xl font-black text-white mt-1">$4,250</h2>
          </div>
          <span class="bg-rose-500/10 text-rose-400 text-[10px] font-bold px-2 py-1 rounded-lg"
            >-3%</span
          >
        </div>
        <div class="h-12 w-full">
          <canvas #revMiniChart></canvas>
        </div>
      </div>

      <div
        class="bg-slate-900/50 border border-white/5 p-5 rounded-3xl flex flex-col justify-between h-40"
      >
        <div class="flex justify-between items-start">
          <div>
            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest"
              >Avg Rating</span
            >
            <h2 class="text-3xl font-black text-white mt-1">4.9</h2>
          </div>
          <span class="bg-sky-500/10 text-sky-400 text-[10px] font-bold px-2 py-1 rounded-lg"
            >New</span
          >
        </div>
        <div class="flex items-center gap-1 text-sky-400">
          <div class="h-1 w-full bg-white/5 rounded-full overflow-hidden">
            <div class="h-full bg-sky-400 w-[98%]"></div>
          </div>
        </div>
      </div>

      <div
        class="bg-slate-900/50 border border-white/5 p-5 rounded-3xl flex flex-col justify-between h-40"
      >
        <div class="flex justify-between items-start">
          <div>
            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest"
              >New Connections</span
            >
            <h2 class="text-3xl font-black text-white mt-1">12</h2>
          </div>
          <span
            class="bg-emerald-500/10 text-emerald-400 text-[10px] font-bold px-2 py-1 rounded-lg"
            >+5%</span
          >
        </div>
        <div class="flex -space-x-2">
          <div class="w-7 h-7 rounded-full bg-slate-700 border-2 border-slate-900"></div>
          <div class="w-7 h-7 rounded-full bg-slate-600 border-2 border-slate-900"></div>
          <div class="w-7 h-7 rounded-full bg-slate-500 border-2 border-slate-900"></div>
        </div>
      </div>
    </div>

    <div class="grid gap-8 md:grid-cols-2">
      <section
        class="bg-white/2 border border-white/10 rounded-4xl overflow-hidden backdrop-blur-sm"
      >
        <div class="px-8 py-6 border-b border-white/5 flex justify-between items-center">
          <h2 class="text-xs font-bold uppercase tracking-widest text-slate-400">
            Activity Overview
          </h2>
          <div class="flex gap-2">
            <button class="px-3 py-1 bg-white/5 rounded-md text-[10px] text-white">Month</button>
            <button class="px-3 py-1 rounded-md text-[10px] text-slate-500">Week</button>
          </div>
        </div>
        <div class="p-8">
          <canvas #barChart class="max-h-64"></canvas>
        </div>
      </section>

      <section
        class="bg-white/2 border border-white/10 rounded-4xl overflow-hidden backdrop-blur-sm"
      >
        <div class="px-8 py-6 border-b border-white/5">
          <h2 class="text-xs font-bold uppercase tracking-widest text-slate-400">Growth Trends</h2>
        </div>
        <div class="p-8">
          <canvas #lineChart class="max-h-64"></canvas>
        </div>
      </section>
    </div>
  </div>
</main>
