<main class="min-h-screen bg-slate-950 font-display">
  <header class="max-w-7xl mx-auto px-6 py-8">
    <h1 class="text-3xl font-black tracking-tight text-slate-100 mb-2">Calendar</h1>
    <p class="text-slate-500 text-sm mb-8 uppercase tracking-widest font-medium">
      Plan your gigs, rehearsals and sessions
    </p>
  </header>

  <div class="max-w-7xl mx-auto px-6 pb-12">
    <div class="glass-card rounded-3xl shadow-2xl p-6 border border-white/10 bg-white/2">
      <full-calendar #calendar [options]="calendarOptions"></full-calendar>
    </div>

    @if (calendarService.calendarModalActive()) {
      <div
        class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm"
        role="dialog"
        aria-modal="true"
      >
        <div
          class="w-full max-w-sm glass-card rounded-2xl shadow-2xl overflow-hidden border border-white/10 bg-slate-900"
        >
          <div class="flex items-center justify-between px-5 py-4 border-b border-white/5">
            <h2 class="font-bold text-slate-100">Add Event</h2>
            <button
              type="button"
              (click)="closeModals()"
              class="text-slate-500 hover:text-slate-200 transition-colors"
            >
              <span class="material-symbols-outlined">close</span>
            </button>
          </div>

          <form class="flex flex-col gap-5 p-5">
            <div class="space-y-2">
              <label class="text-xs font-semibold uppercase tracking-widest text-slate-500 block"
                >Event name</label
              >
              <input
                type="text"
                placeholder="Balm show @ Palau St. Jordi"
                [value]="calendarService.eventTitle()"
                (input)="onTitleInput($event)"
                class="w-full px-4 py-3 bg-black/30 border border-white/10 rounded-xl text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all"
              />
            </div>

            <div class="space-y-2">
              <label class="text-xs font-semibold uppercase tracking-widest text-slate-500 block"
                >Event color</label
              >
              <select
                [value]="calendarService.eventColor()"
                (change)="onColorChange($event)"
                class="w-full px-4 py-3 bg-black/30 border border-white/10 rounded-xl text-sm text-slate-200 cursor-pointer appearance-none transition-all"
              >
                <option value="">-- Choose color --</option>
                <option value="red">Red</option>
                <option value="blue">Blue</option>
                <option value="green">Green</option>
                <option value="yellow">Yellow</option>
                <option value="cyan">Cyan</option>
                <option value="pink">Pink</option>
                <option value="purple">Purple</option>
              </select>
            </div>

            <div class="flex justify-end gap-3 pt-2">
              <button
                type="button"
                (click)="closeModals()"
                class="px-4 py-2 text-sm font-medium rounded-xl border border-white/10 text-slate-400 hover:bg-white/5 transition-all"
              >
                Cancel
              </button>
              <button
                type="button"
                (click)="saveEvent()"
                [disabled]="calendarService.loadingSignal()"
                class="px-6 py-2 text-sm rounded-xl bg-primary text-white font-bold shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all disabled:opacity-50"
              >
                {{ calendarService.loadingSignal() ? 'Saving...' : 'Save' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    }

    @if (calendarService.editCalendarModalActive()) {
      <div
        class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm"
        role="dialog"
        aria-modal="true"
      >
        <div
          class="w-full max-w-sm glass-card rounded-2xl shadow-2xl overflow-hidden border border-white/10 bg-slate-900"
        >
          <div class="flex items-center justify-between px-5 py-4 border-b border-white/5">
            <h2 class="font-bold text-slate-100">Edit Event</h2>
            <button
              type="button"
              (click)="closeModals()"
              class="text-slate-500 hover:text-slate-200 transition-colors"
            >
              <span class="material-symbols-outlined">close</span>
            </button>
          </div>

          <form class="flex flex-col gap-5 p-5">
            <div class="space-y-2">
              <label class="text-xs font-semibold uppercase tracking-widest text-slate-500 block"
                >Event name</label
              >
              <input
                type="text"
                [value]="calendarService.eventTitle()"
                (input)="onTitleInput($event)"
                class="w-full px-4 py-3 bg-black/30 border border-white/10 rounded-xl text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all"
              />
            </div>

            <div class="space-y-2">
              <label class="text-xs font-semibold uppercase tracking-widest text-slate-500 block"
                >Event color</label
              >
              <select
                [value]="calendarService.eventColor()"
                (change)="onColorChange($event)"
                class="w-full px-4 py-3 bg-black/30 border border-white/10 rounded-xl text-sm text-slate-200 cursor-pointer appearance-none transition-all"
              >
                <option value="red">Red</option>
                <option value="blue">Blue</option>
                <option value="green">Green</option>
                <option value="yellow">Yellow</option>
                <option value="cyan">Cyan</option>
                <option value="pink">Pink</option>
                <option value="purple">Purple</option>
              </select>
            </div>

            <div class="flex justify-end gap-2 pt-2">
              <button
                type="button"
                (click)="closeModals()"
                class="px-4 py-2 text-sm font-medium rounded-xl border border-white/10 text-slate-400 hover:bg-white/5 transition-all"
              >
                Cancel
              </button>
              <button
                type="button"
                (click)="deleteEvent(calendarService.selectedEvent().id)"
                [disabled]="calendarService.loadingSignal()"
                class="px-4 py-2 text-sm font-bold rounded-xl border border-red-500/30 text-red-400 hover:bg-red-500/10 transition-all disabled:opacity-50"
              >
                {{ calendarService.loadingSignal() ? '...' : 'Delete' }}
              </button>
              <button
                type="button"
                (click)="editEvent()"
                [disabled]="calendarService.loadingSignal()"
                class="px-6 py-2 text-sm rounded-xl bg-primary text-white font-bold shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all disabled:opacity-50"
              >
                {{ calendarService.loadingSignal() ? 'Updating...' : 'Save' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    }
  </div>
</main>
