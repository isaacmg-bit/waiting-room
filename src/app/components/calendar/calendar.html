<main>
  <div>
    <div
      class="rounded-4xl border border-white/10 bg-black/30 backdrop-blur-xl shadow-2xl overflow-hidden"
    >
      <div class="flex items-center justify-between p-8 border-b border-white/5 bg-white/1">
        <div class="flex items-center gap-8">
          <div class="flex items-center gap-4">
            <span class="material-symbols-outlined text-3xl text-slate-200">calendar_month</span>
            <h2 class="text-2xl font-bold text-white tracking-tight">Events</h2>
          </div>

          <div class="flex items-center gap-4 border-l border-white/10 pl-8">
            <h3 class="text-lg font-bold text-slate-300 min-w-40">{{ calendarTitle() }}</h3>
            <div class="flex gap-1 p-1 bg-black/40 rounded-xl border border-white/5">
              <button
                (click)="prev()"
                class="p-1.5 text-slate-500 hover:text-white transition-colors focus:outline-none"
              >
                <span class="material-symbols-outlined text-sm">chevron_left</span>
              </button>
              <button
                (click)="today()"
                class="px-3 py-1 text-[10px] font-black uppercase tracking-widest text-slate-500 hover:text-white transition-colors focus:outline-none"
              >
                Today
              </button>
              <button
                (click)="next()"
                class="p-1.5 text-slate-500 hover:text-white transition-colors focus:outline-none"
              >
                <span class="material-symbols-outlined text-sm">chevron_right</span>
              </button>
            </div>
          </div>
        </div>

        <div class="flex gap-1 p-1 bg-black/40 rounded-xl border border-white/5">
          <button
            (click)="changeView('dayGridMonth')"
            [class]="
              currentView() === 'dayGridMonth'
                ? 'bg-white/10 text-white shadow-lg'
                : 'text-slate-500 hover:text-slate-200'
            "
            class="px-5 py-1.5 text-xs font-bold rounded-lg transition-all"
          >
            Month
          </button>
          <button
            (click)="changeView('dayGridWeek')"
            [class]="
              currentView() === 'dayGridWeek'
                ? 'bg-white/10 text-white shadow-lg'
                : 'text-slate-500 hover:text-slate-200'
            "
            class="px-5 py-1.5 text-xs font-bold rounded-lg transition-all"
          >
            Week
          </button>
        </div>
      </div>

      <div class="p-8">
        <div
          class="w-full aspect-3/4 lg:aspect-21/9 sm:aspect-video rounded-3xl border border-white/5 bg-slate-900/50 overflow-hidden relative"
        >
          <div class="absolute inset-0 p-4">
            <full-calendar #calendar [options]="calendarOptions"></full-calendar>
          </div>
        </div>
      </div>
    </div>
  </div>

  @if (calendarService.calendarModalActive()) {
    <div
      class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-in fade-in duration-300"
    >
      <div
        class="w-full max-w-sm rounded-3xl border border-white/10 bg-slate-900/90 p-1 shadow-2xl backdrop-blur-2xl"
      >
        <div
          class="flex items-center justify-between px-6 py-5 border-b border-white/5 bg-white/2 rounded-t-3xl"
        >
          <h2 class="font-bold text-lg text-white">Add New Event</h2>
          <button (click)="closeModals()" class="text-slate-500 hover:text-white transition-colors">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <form class="flex flex-col gap-4 p-5">
          <div class="space-y-2">
            <label class="text-xs font-semibold uppercase tracking-widest text-slate-500"
              >Event name</label
            >
            <input
              type="text"
              placeholder="Balm show @ Palau St. Jordi"
              [value]="calendarService.eventTitle()"
              (input)="onTitleInput($event)"
              class="w-full px-4 py-3 bg-black/30 border border-white/10 rounded-xl text-sm focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary/50 text-slate-200 placeholder:text-slate-600 transition-all"
            />
          </div>
          <div class="space-y-2">
            <label class="text-xs font-semibold uppercase tracking-widest text-slate-500"
              >Event color</label
            >
            <select
              [value]="calendarService.eventColor()"
              (change)="onColorChange($event)"
              class="w-full px-4 py-3 bg-black/30 border border-white/10 rounded-xl text-sm focus:outline-none focus:ring-1 focus:ring-primary text-slate-200 transition-all"
            >
              <option value="">-- Choose color --</option>
              <option value="red">Red</option>
              <option value="blue">Blue</option>
              <option value="green">Green</option>
              <option value="yellow">Yellow</option>
              <option value="cyan">Cyan</option>
              <option value="pink">Pink</option>
              <option value="purple">Purple</option>
            </select>
          </div>
          <div class="space-y-2">
            <label class="text-xs font-semibold uppercase tracking-widest text-slate-500"
              >Event type</label
            >
            <select
              [value]="calendarService.eventType()"
              (change)="onTypeChange($event)"
              class="w-full px-4 py-3 bg-black/30 border border-white/10 rounded-xl text-sm focus:outline-none focus:ring-1 focus:ring-primary text-slate-200 transition-all"
            >
              <option value="">-- Choose type --</option>
              <option value="show">Show</option>
              <option value="rehearsalspace">Rehearsal</option>
            </select>
          </div>

          <app-user-location
            [control]="form.controls.street"
            (streetSelected)="onStreetSelected($event)"
          ></app-user-location>

          <div class="checkbox-wrapper">
            <input
              type="checkbox"
              id="is_public"
              [checked]="calendarService.isPublicSignal()"
              (change)="onCheckboxChange($event)"
            />
            <label for="is_public" class="ml-3">Public event</label>
          </div>

          <div class="flex justify-end gap-2 pt-2">
            <button
              type="button"
              (click)="closeModals()"
              class="px-4 py-2 text-sm rounded-xl border border-white/10 text-slate-400 hover:bg-white/5 transition-all"
            >
              Cancel
            </button>
            <button
              type="button"
              (click)="saveEvent()"
              class="px-6 py-2 text-sm rounded-xl bg-primary text-white font-bold shadow-lg shadow-primary/20 hover:scale-[1.02] transition-all"
            >
              Save
            </button>
          </div>
        </form>
      </div>
    </div>
  }

  @if (calendarService.editCalendarModalActive()) {
    <div
      class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-in fade-in duration-300"
    >
      <div
        class="w-full max-w-sm rounded-3xl border border-white/10 bg-slate-900/90 p-1 shadow-2xl backdrop-blur-2xl"
      >
        <div
          class="flex items-center justify-between px-6 py-5 border-b border-white/5 bg-white/2 rounded-t-3xl"
        >
          <h2 class="font-bold text-lg text-white">Edit Event</h2>
          <button (click)="closeModals()" class="text-slate-500 hover:text-white transition-colors">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>
        <form class="flex flex-col gap-6 p-6">
          <div class="space-y-2">
            <label class="text-[10px] font-black uppercase tracking-widest text-slate-500 ml-1"
              >Event Title</label
            >
            <input
              type="text"
              [value]="calendarService.eventTitle()"
              (input)="onTitleInput($event)"
              class="w-full px-4 py-3 bg-black/40 border border-white/10 rounded-2xl text-sm text-white focus:outline-none focus:ring-2 focus:ring-primary/40 transition-all"
            />
          </div>
          <div class="space-y-2">
            <label class="text-xs font-semibold uppercase tracking-widest text-slate-500"
              >Event color</label
            >
            <select
              [value]="calendarService.eventColor()"
              (change)="onColorChange($event)"
              class="w-full px-4 py-3 bg-black/30 border border-white/10 rounded-xl text-sm focus:outline-none focus:ring-1 focus:ring-primary text-slate-200 transition-all"
            >
              <option value="">-- Choose color --</option>
              <option value="red">Red</option>
              <option value="blue">Blue</option>
              <option value="green">Green</option>
              <option value="yellow">Yellow</option>
              <option value="cyan">Cyan</option>
              <option value="pink">Pink</option>
              <option value="purple">Purple</option>
            </select>
          </div>
          <div class="space-y-2">
            <label class="text-xs font-semibold uppercase tracking-widest text-slate-500"
              >Event type</label
            >
            <select
              [value]="calendarService.eventType()"
              (change)="onTypeChange($event)"
              class="w-full px-4 py-3 bg-black/30 border border-white/10 rounded-xl text-sm focus:outline-none focus:ring-1 focus:ring-primary text-slate-200 transition-all"
            >
              <option value="">-- Choose type --</option>
              <option value="show">Show</option>
              <option value="rehearsalspace">Rehearsal</option>
            </select>
          </div>

          <app-user-location
            [control]="form.controls.street"
            (streetSelected)="onStreetSelected($event)"
          ></app-user-location>

          <div class="checkbox-wrapper">
            <input
              type="checkbox"
              id="is_public"
              [checked]="calendarService.isPublicSignal()"
              (change)="onCheckboxChange($event)"
            />
            <label for="is_public" class="ml-3">Public event</label>
          </div>

          <div class="flex items-center justify-between gap-3 pt-2">
            <button
              (click)="deleteEvent(calendarService.selectedEvent()!.id)"
              type="button"
              class="flex items-center gap-2 px-4 py-2.5 text-xs font-bold rounded-xl border border-red-500/20 text-red-500"
            >
              <span class="material-symbols-outlined text-sm">delete</span> Delete
            </button>
            <div class="flex gap-2">
              <button
                (click)="closeModals()"
                type="button"
                class="px-4 py-2.5 text-xs font-bold rounded-xl border border-white/5 text-slate-400"
              >
                Cancel
              </button>
              <button
                (click)="editEvent()"
                type="button"
                class="px-6 py-2.5 text-xs rounded-xl bg-primary text-white font-black"
              >
                Save
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  }
</main>
