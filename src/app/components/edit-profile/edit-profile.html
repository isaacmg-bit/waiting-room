<main class="min-h-screen bg-slate-950 font-display text-slate-100">
  <div class="mx-auto max-w-5xl px-4 py-8 md:px-8">
    <form [formGroup]="form" class="space-y-6">
      <section class="glass-card rounded-3xl p-6 md:p-8">
        <div class="flex items-center gap-3 mb-6">
          <span class="material-symbols-outlined text-primary">photo_camera</span>
          <h2 class="text-xl font-bold">Profile Media</h2>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <div class="flex flex-col items-center gap-4">
            <div class="relative group">
              <button
                type="button"
                class="size-48 rounded-full overflow-hidden border-4 border-primary/20 p-1 cursor-pointer focus:outline-none"
                (click)="profileFileInput.click()"
              >
                <img
                  #img
                  class="w-full h-full object-cover rounded-full opacity-80 group-hover:opacity-100 transition-opacity"
                  [src]="profilePhotoUrl() || 'assets/img/Portrait_Placeholder.png'"
                  (error)="img.src = 'assets/img/Portrait_Placeholder.png'"
                  alt="Profile photo"
                />
              </button>

              @if (profilePhotoUrl()) {
                <button
                  type="button"
                  (click)="removeProfilePhoto()"
                  class="absolute cursor-pointer top-1 right-1 bg-black/50 text-white rounded-full p-1 hover:bg-red-600 z-10 flex items-center justify-center"
                >
                  <ng-icon name="heroTrash" size="16" />
                </button>
              }

              <input
                type="file"
                #profileFileInput
                hidden
                accept="image/*"
                (change)="onProfileSelected($event)"
              />
            </div>
          </div>

          <div class="lg:col-span-2 relative">
            <p class="block text-xs font-semibold mb-3 text-slate-400 uppercase tracking-widest">
              Showcase Gallery
            </p>
            <p class="mb-3 text-xs text-slate-500">Upload up to 4 photos.</p>
            <app-user-gallery></app-user-gallery>
          </div>
        </div>
      </section>

      <section class="glass-card rounded-3xl p-6 md:p-8">
        <div class="flex items-center gap-3 mb-6">
          <span class="material-symbols-outlined text-cyan-400">badge</span>
          <h2 class="text-xl font-bold">Identity</h2>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label for="name" class="text-xs font-semibold text-slate-500 uppercase tracking-widest"
              >User name</label
            >
            <input
              id="name"
              formControlName="name"
              class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none text-slate-200"
              type="text"
              placeholder="Stage or real name"
            />
          </div>

          <div class="space-y-2">
            <label
              for="email"
              class="text-xs font-semibold text-slate-500 bg-gr uppercase tracking-widest"
              >Email Address</label
            >
            <input
              id="email"
              formControlName="email"
              class="w-full border border-white/10 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none text-slate-200 bg-gray-800"
              type="email"
              placeholder="hello@musician.com"
            />
          </div>

          <div class="md:col-span-2">
            <app-user-location
              [control]="form.controls.location"
              (citySelected)="form.controls.location.setValue($event)"
            ></app-user-location>
          </div>

          <div class="md:col-span-2">
            <div class="flex items-center gap-3 mb-6">
              <span class="material-symbols-outlined text-primary">person</span>
              <h2 class="text-xl font-bold">Bio</h2>
            </div>
            <textarea
              id="bio"
              formControlName="bio"
              maxlength="350"
              class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none resize-none text-slate-200"
              placeholder="Describe yourself"
              rows="4"
            ></textarea>
          </div>
        </div>
      </section>

      <section class="glass-card rounded-3xl p-6 md:p-8">
        <div class="flex items-center gap-3 mb-6">
          <span class="material-symbols-outlined text-purple-400">music_note</span>
          <h2 class="text-xl font-bold">Musical DNA</h2>
        </div>
        <div class="space-y-6">
          <div>
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-widest block mb-3">
              Instruments
            </p>
            <app-user-instruments></app-user-instruments>
          </div>
          <div class="mt-6 pt-6 relative border-t border-white/5">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-widest block mb-3">
              Genres
            </p>
            <app-user-genres></app-user-genres>
          </div>
          <div class="mt-6 pt-6 relative border-t border-white/5">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-widest block mb-3">
              Influence Bands
            </p>
            <app-user-bands></app-user-bands>
          </div>
        </div>
      </section>

      <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="glass-card rounded-3xl p-6 md:p-8">
          <div class="flex items-center gap-3 mb-6">
            <span class="material-symbols-outlined text-primary">speaker</span>
            <h2 class="text-xl font-bold">Gear &amp; Equipment</h2>
          </div>
          <textarea
            formControlName="gear"
            maxlength="350"
            placeholder="Describe your gear..."
            rows="4"
            class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none resize-none text-slate-200"
          ></textarea>
        </div>

        <div class="glass-card rounded-3xl p-6 md:p-8">
          <div class="flex items-center gap-3 mb-6">
            <span class="material-symbols-outlined text-cyan-400">room_preferences</span>
            <h2 class="text-xl font-bold">Rehearsal Space</h2>
          </div>
          <textarea
            formControlName="rehearsal_space"
            maxlength="350"
            placeholder="Details about your space..."
            rows="4"
            class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none resize-none text-slate-200"
          ></textarea>
        </div>
      </section>

      <section class="glass-card rounded-3xl p-6 md:p-8">
        <div class="flex items-center gap-3 mb-6">
          <span class="material-symbols-outlined text-purple-400">language</span>
          <h2 class="text-xl font-bold">Presence</h2>
        </div>

        <div class="space-y-3">
          <div class="flex flex-col md:flex-row gap-4 items-end md:items-center">
            <div class="w-full md:w-1/4">
              <label class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1 block"
                >Platform</label
              >
              <div class="relative">
                <select
                  class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 pr-10 focus:ring-2 focus:ring-primary outline-none text-slate-200 appearance-none cursor-pointer"
                >
                  <option value="" disabled selected>Select platform</option>
                  <option value="instagram">Instagram</option>
                  <option value="soundcloud">SoundCloud</option>
                  <option value="spotify">Spotify</option>
                  <option value="youtube">YouTube</option>
                </select>

                <span
                  class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"
                >
                  expand_more
                </span>
              </div>
            </div>

            <div class="flex-1 w-full">
              <label class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1 block"
                >Handle</label
              >
              <input
                input
                placeholder="username"
                type="text"
                class="w-full bg-black/30 border border-white/10 rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary outline-none text-slate-200"
              />
            </div>

            <button
              type="button"
              class="p-3 text-red-500 hover:bg-red-500/10 rounded-xl transition-colors"
            >
              <span class="material-symbols-outlined">delete</span>
            </button>
          </div>
        </div>

        <button
          type="button"
          class="mt-4 px-4 py-3 bg-primary text-white rounded-xl hover:bg-primary/90 flex items-center gap-2 disabled:opacity-50"
        >
          <span class="material-symbols-outlined">add</span>
          Add Link
        </button>
      </section>

      <div class="sticky bottom-6 z-20 flex justify-center pb-8">
        <div
          class="bg-black/50 backdrop-blur-2xl border border-white/10 p-2 rounded-2xl shadow-2xl flex items-center gap-4"
        >
          <button
            class="px-6 py-3 rounded-xl font-medium hover:bg-white/5 transition-colors text-slate-300"
            type="button"
            (click)="discardChanges()"
          >
            Discard
          </button>
          <button
            type="button"
            (click)="saveProfile()"
            class="px-10 py-3 bg-primary text-white font-black rounded-xl shadow-lg shadow-primary/30 hover:scale-[1.05] transition-transform"
          >
            Save profile changes
          </button>
        </div>
      </div>
    </form>
  </div>
</main>
